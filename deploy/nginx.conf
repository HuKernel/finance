# FinanceCrew 生产部署 Nginx 配置
#
# 部署步骤:
# 1. 安装 Nginx + Certbot:
#    sudo apt install nginx certbot python3-certbot-nginx
#
# 2. 复制配置:
#    sudo cp nginx.conf /etc/nginx/sites-available/financecrew
#    sudo ln -s /etc/nginx/sites-available/financecrew /etc/nginx/sites-enabled/
#
# 3. 申请 SSL 证书 (替换 yourdomain.com):
#    sudo certbot --nginx -d yourdomain.com
#
# 4. 重载 Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 5. 启动后端 (监听 127.0.0.1:8000，不暴露到外网):
#    cd backend && .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

# API 限流（sites-available 文件被 include 在 http{} 内，zone 声明放这里）
limit_req_zone $binary_remote_addr zone=fc_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fc_auth:10m rate=1r/s;

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # SSL 证书 (certbot 自动填充)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss:; font-src 'self' data:" always;

    # 反向代理到后端
    location / {
        limit_req zone=fc_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（对话/投研分析）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 文件上传限制
        client_max_body_size 10m;
    }

    # 登录/注册类接口更严格的限流（防爆破）
    location /api/auth/ {
        limit_req zone=fc_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查不记日志
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # 访问日志
    access_log /var/log/nginx/financecrew_access.log;
    error_log /var/log/nginx/financecrew_error.log;
}
