version: "3.8"

services:
  financecrew:
    build: .
    container_name: financecrew
    ports:
      - "8000:8000"
    volumes:
      - financecrew-data:/app/data
    environment:
      - DB_PATH=/app/data/financecrew.db
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
    restart: unless-stopped

volumes:
  financecrew-data:
