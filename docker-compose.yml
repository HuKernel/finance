version: "3.8"

services:
  financecrew:
    build: .
    container_name: financecrew
    ports:
      - "127.0.0.1:8000:8000"  # 只绑本机，外网访问必须经 nginx TLS 反代
    volumes:
      - financecrew-data:/app/data
    environment:
      - DB_PATH=/app/data/financecrew.db
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
    restart: unless-stopped

volumes:
  financecrew-data:
